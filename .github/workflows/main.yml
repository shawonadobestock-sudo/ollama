name: Gemma 4 API Fix (ngrok)
on:
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Configure and Start Ollama
        run: |
          # OLLAMA_HOST="0.0.0.0" makes the server listen to external traffic
          # OLLAMA_ORIGINS="*" allows the web chatbot to bypass CORS security
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_ORIGINS="*"
          
          echo "Starting Ollama server..."
          ollama serve & 
          
          # Wait for server to wake up
          sleep 15

      - name: Download Model
        run: |
          # Pulling gemma:2b is recommended for stable performance on GitHub runners
          echo "Downloading model..."
          ollama pull gemma:2b

      - name: Setup ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Install ngrok via official script
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # Auth and Start Tunnel
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          echo "------------------------------------------------"
          echo "GETTING PUBLIC URL..."
          # Start ngrok in background
          ngrok http 11434 --log=stdout &
          sleep 10
          
          # Extract and Print URL clearly
          export PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "------------------------------------------------"
          echo "COPY THIS URL: $PUBLIC_URL"
          echo "------------------------------------------------"
          
          # Keep runner alive for 6 hours
          sleep 21600
