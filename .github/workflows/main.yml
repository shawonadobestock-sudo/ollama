name: Gemma 4 API (Production Fix)
on:
  workflow_dispatch:

jobs:
  serve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Configure and Start Ollama
        run: |
          # 0.0.0.0:11434 = Listen on all network interfaces
          # OLLAMA_ORIGINS="*" = Allow the chatbot website to connect
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_ORIGINS="*"
          
          echo "Starting Ollama Server..."
          ollama serve & 
          sleep 15 # Wait for initialization

      - name: Pull Model
        run: |
          # Pulling gemma:2b for stability on 7GB RAM runners
          ollama pull gemma:2b

      - name: Setup ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Install ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # Authenticate
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # CRITICAL: --host-header fix for Ollama API
          echo "Starting Tunnel..."
          ngrok http 11434 --host-header="localhost:11434" --log=stdout &
          sleep 10
          
          echo "------------------------------------------------"
          echo "PUBLIC ENDPOINT FOR CHATBOT:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "------------------------------------------------"
          
          # Keep Action alive for 6 hours
          sleep 21600
