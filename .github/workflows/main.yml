name: Gemma 4 API (Latest Model)
on:
  workflow_dispatch:

jobs:
  run-latest-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server
        run: |
          # Bind to 0.0.0.0 so the ngrok tunnel can see it
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_ORIGINS="*"
          ollama serve & 
          sleep 15

      - name: Pull Latest Gemma 4
        run: |
          # We use 'gemma4:2b' as it is the most stable 'latest' model for 7GB RAM
          echo "Pulling latest Gemma 4 model..."
          ollama pull gemma4:2b

      - name: Setup ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Install ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # Authenticate
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # Start ngrok with the Host Header Fix to prevent 403 Forbidden errors
          ngrok http 11434 --host-header="localhost:11434" --log=stdout &
          sleep 10
          
          echo "------------------------------------------------"
          echo "NEW ENDPOINT URL:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "------------------------------------------------"
          echo "IMPORTANT: In your Python/HTML, use model: 'gemma4:2b'"
          echo "------------------------------------------------"
          
          # Keeps the runner alive for 6 hours
          sleep 21600
