name: Gemma 4 API (E2B Version)
on:
  workflow_dispatch:

jobs:
  serve-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama (Remote Config)
        run: |
          # 0.0.0.0 allows ngrok to connect to the internal port
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_ORIGINS="*"
          ollama serve & 
          sleep 15

      - name: Pull Effective Gemma 4
        run: |
          # 'e2b' is the correct tag for the 2026 small Gemma 4 model
          echo "Pulling gemma4:e2b..."
          ollama pull gemma4:e2b

      - name: Setup ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # Fix the Host Header for external API access
          ngrok http 11434 --host-header="localhost:11434" --log=stdout &
          sleep 10
          
          echo "------------------------------------------------"
          echo "PUBLIC URL: $(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')"
          echo "MODEL TAG TO USE: gemma4:e2b"
          echo "------------------------------------------------"
          
          # 6-hour runtime
          sleep 21600
