name: Gemma 4 API via ngrok
on:
  workflow_dispatch: # Allows you to start it manually

jobs:
  run-ai-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server
        run: |
          # Allow the chatbot site to connect (CORS Fix)
          export OLLAMA_ORIGINS="*" 
          ollama serve & 
          sleep 10

      - name: Pull Gemma 4
        run: |
          # Using gemma:2b is recommended for faster testing on GitHub Runners
          # Change to 'gemma4' if you have confirmed the runner can handle the size
          ollama pull gemma:2b

      - name: Setup ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Install ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # Authenticate
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # Start Tunnel
          ngrok http 11434 --log=stdout &
          sleep 5

      - name: Output Public URL
        run: |
          echo "------------------------------------------------"
          echo "COPY THIS URL TO YOUR CHATBOT SITE:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "------------------------------------------------"
          
          # Keep the action running for 6 hours (standard limit)
          # This prevents the tunnel from closing immediately
          sleep 21600
